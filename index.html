<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b38">
<meta name="description" content="Iron Ledger — a local-first, gamified workout tracker with game-style stat charts.">
<title>Iron Ledger — Workout Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo"><svg class="logo-px" viewBox="0 0 7 7" width="16" height="16" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" focusable="false"><rect x="0" y="1" width="2" height="5"/><rect x="5" y="1" width="2" height="5"/><rect x="2" y="3" width="3" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/></svg></span><span class="brand-txt">Iron Ledger</span></div>
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div class="hud">
    <div class="hud-level">
      <span id="hud-level"></span>
      <span class="xp-track"><i id="hud-xpbar"></i></span>
    </div>
    <div class="hud-item" id="hud-week"></div>
    <button class="btn ghost tiny" id="btn-units">KG</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="dash" class="on">Dashboard</button>
  <button data-tab="log">Log</button>
  <button data-tab="nutrition">Nutrition</button>
  <button data-tab="hero">Hero</button>
  <button data-tab="history">History</button>
  <button data-tab="library">Exercises</button>
  <button data-tab="profile">Profile</button>
</nav>

<main id="view"></main>

<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Dialog"><div class="modal-box" id="modal-box"></div></div>

<script src="js/data.js"></script>
<script src="js/seed.js"></script>
<script src="js/engine.js"></script>
<script src="js/chart.js"></script>
<script src="js/native.js"></script>
<script src="js/updater.js"></script>
<script src="js/store.js"></script>
<script src="js/welcome.js"></script>
<script src="js/glossary.js"></script>
<script src="js/macros.js"></script>
<script src="js/food.js"></script>
<script src="js/barcode.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/hero.js"></script>
<script src="js/herotab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
