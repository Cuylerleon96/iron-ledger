# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# This box has ~7.7 GB of RAM TOTAL and it is used as a desktop while it builds
# (Steam + browser + the agent), so the daemon gets a 2560 MB cap that the JVM
# commits lazily, plus a bounded metaspace. 4 GB+ on an 8 GB machine invites
# swapping, and swap is already in use here; 1 GB (the old 1536m) was tight for
# the AGP transforms. 2560m is the middle: enough to finish the build, small
# enough to leave the desktop its RAM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build the independent projects in parallel (the app module plus the capacitor
# android library modules). There are enough of them to overlap configuration
# and task execution.
org.gradle.parallel=true

# Reuse task outputs across builds, and across a `clean`, via the local build
# cache. A repeat release build re-uses dex/resources/packaging instead of
# redoing them.
org.gradle.caching=true

# 12 threads but only ~7.7 GB of RAM: cap the worker pool so parallel
# dexing/packaging cannot out-run the memory budget and swap. Half the threads
# keeps the build parallel without starving the desktop it shares the box with.
org.gradle.workers.max=6

# Compile Kotlin INSIDE the Gradle daemon rather than in a separate Kotlin
# daemon JVM. One less ~1 GB process on an 8 GB box, and no silent fallback to
# in-process compilation when a memory-starved Kotlin daemon dies mid-build —
# the execution strategy is chosen here, not by an OOM.
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
